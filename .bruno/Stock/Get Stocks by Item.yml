info:
  name: Get Stocks by Item
  type: http
  seq: 3

http:
  method: GET
  url: "{{BaseUrl}}/api/stocks/item/:itemId"
  auth: inherit
  params:
    - name: itemId
      value: "{{itemId}}"
      type: path
      enabled: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
