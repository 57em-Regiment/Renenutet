info:
  name: Get Stocks by Inventory
  type: http
  seq: 2

http:
  method: GET
  url: "{{BaseUrl}}/api/stocks/inventory/:inventoryId"
  auth: inherit
  params:
    - name: inventoryId
      value: "{{inventoryId}}"
      type: path
      enabled: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
