name: CI — Renenutet

on:
  push:
    branches: [develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: 57regiment/.github/.github/workflows/_reusable-build-node.yml@main
    secrets: inherit
    with:
      artifact_name: renenutet-runtime
      # Renenutet a des link: vers wan-shi-tong et Krang/API/packages/contract
      checkout_wan_shi_tong: true
      checkout_krang: true

  docker:
    needs: build
    uses: 57regiment/.github/.github/workflows/_reusable-docker.yml@main
    secrets: inherit
    with:
      image_name: renenutet
      artifact_name: renenutet-runtime

  deploy:
    needs: docker
    if: needs.docker.outputs.target == 'staging' || needs.docker.outputs.target == 'prod'
    uses: 57regiment/.github/.github/workflows/_reusable-deploy.yml@main
    secrets: inherit
    with:
      target: ${{ needs.docker.outputs.target }}
      image_name: renenutet
